    // ---- Low-poly person figure ----
    function makePerson(seed, pose){
      const grp = new THREE.Group();
      const rnd = n => {
        const x = Math.sin(seed * 7.123 + n * 13.456) * 43758.5453;
        return x - Math.floor(x);
      };
      const skins   = [0xc99c7d, 0x8d6048, 0xead4b6, 0xa67849, 0x6f3f23, 0xe0bc94];
      const shirts  = [0xc4282a, 0x2a4a7a, 0x4a7a3a, 0xd9b04a, 0x5a3a82,
                       0x282826, 0x8a5a3a, 0x2a8aa8, 0xc36a2a, 0xeae0c2];
      const pants   = [0x383838, 0x2a3550, 0x4a3a2a, 0x252525, 0x3e3528, 0x6a5a48];
      const hairs   = [0x1a1410, 0x3e2818, 0x6a4a28, 0x8a6a2a, 0xd9c08a, 0x4a3528];
      const skinMat  = new THREE.MeshStandardMaterial({ color: skins[seed % skins.length], roughness:0.7 });
      const shirtMat = new THREE.MeshStandardMaterial({ color: shirts[Math.floor(rnd(1) * shirts.length)], roughness:0.85 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: pants[Math.floor(rnd(2) * pants.length)], roughness:0.85 });
      const hairMat  = new THREE.MeshStandardMaterial({ color: hairs[Math.floor(rnd(3) * hairs.length)], roughness:0.85 });

      function head(y){
        const h = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), skinMat);
        h.position.y = y; grp.add(h);
        const cap = new THREE.Mesh(
          new THREE.SphereGeometry(0.135, 10, 8, 0, Math.PI*2, 0, Math.PI/2.1),
          hairMat
        );
        cap.position.y = y; grp.add(cap);
      }

      if (pose === 'sit'){
        // Hips rest on the bench seat. Bench seat top is at world
        // y = groundY + 0.48; people are placed at groundY + 0.05,
        // so hips sit at relative y = 0.43.
        const HIP = 0.43;
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.5, 0.26), shirtMat);
        torso.position.set(0, HIP + 0.25, -0.04);   // shifted back slightly toward the backrest
        grp.add(torso);
        // Head (at top of torso + neck/head radius)
        const headSphere = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), skinMat);
        headSphere.position.set(0, HIP + 0.63, -0.04);
        grp.add(headSphere);
        const cap = new THREE.Mesh(
          new THREE.SphereGeometry(0.135, 10, 8, 0, Math.PI*2, 0, Math.PI/2.1), hairMat
        );
        cap.position.set(0, HIP + 0.63, -0.04);
        grp.add(cap);
        // Arms hanging from shoulders (shoulders at HIP + 0.5)
        const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.46, 6), shirtMat);
        armL.position.set(-0.25, HIP + 0.27, 0);
        grp.add(armL);
        const armR = armL.clone(); armR.position.x = 0.25; grp.add(armR);
        // Upper legs: horizontal at hip height, going forward to knee
        const upL = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.075, 0.42, 6), pantsMat);
        upL.rotation.x = Math.PI / 2;
        upL.position.set(-0.1, HIP, 0.21);
        grp.add(upL);
        const upR = upL.clone(); upR.position.x = 0.1; grp.add(upR);
        // Lower legs: vertical, hanging from the knee at z=0.42
        const loL = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.45, 6), pantsMat);
        loL.position.set(-0.1, HIP - 0.215, 0.42);
        grp.add(loL);
        const loR = loL.clone(); loR.position.x = 0.1; grp.add(loR);

      } else if (pose === 'walk'){
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.55, 0.26), shirtMat);
        torso.position.y = 1.15; torso.rotation.x = -0.04; grp.add(torso);
        head(1.55);

        // Arms wrapped in groups whose origins sit at the shoulders
        // (top of the torso). The arm mesh is offset down by half
        // its length so the top of the cylinder lands on the
        // group's origin -- when the group rotates, the shoulder
        // stays put and only the hand swings.
        function makeLimb(meshArgs, length, mat){
          const g = new THREE.Group();
          const m = new THREE.Mesh(meshArgs, mat);
          m.position.y = -length / 2;
          g.add(m);
          return g;
        }
        const armL = makeLimb(new THREE.CylinderGeometry(0.06, 0.05, 0.55, 6), 0.55, shirtMat);
        armL.position.set(-0.25, 1.4, 0);
        armL.rotation.x = -0.25;
        grp.add(armL);
        const armR = makeLimb(new THREE.CylinderGeometry(0.06, 0.05, 0.55, 6), 0.55, shirtMat);
        armR.position.set( 0.25, 1.4, 0);
        armR.rotation.x = 0.25;
        grp.add(armR);

        // Legs wrapped the same way; pivot is at the hip (top of leg)
        const legL = makeLimb(new THREE.CylinderGeometry(0.085, 0.06, 0.85, 6), 0.85, pantsMat);
        legL.position.set(-0.1, 0.85, 0);
        legL.rotation.x = -0.25;
        grp.add(legL);
        const legR = makeLimb(new THREE.CylinderGeometry(0.085, 0.06, 0.85, 6), 0.85, pantsMat);
        legR.position.set( 0.1, 0.85, 0);
        legR.rotation.x = 0.18;
        grp.add(legR);

        // Save the *groups* (not the meshes) so the gait animator
        // rotates each limb around its socket.
        grp.userData.legL = legL;
        grp.userData.legR = legR;
        grp.userData.armL = armL;
        grp.userData.armR = armR;

      } else {  // 'stand'
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.6, 0.26), shirtMat);
        torso.position.y = 1.15; grp.add(torso);
        head(1.55);
        const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.6, 6), shirtMat);
        armL.position.set(-0.25, 1.05, 0); grp.add(armL);
        const armR = armL.clone(); armR.position.x = 0.25; grp.add(armR);
        const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.06, 0.85, 6), pantsMat);
        legL.position.set(-0.1, 0.43, 0); grp.add(legL);
        const legR = legL.clone(); legR.position.x = 0.1; grp.add(legR);
      }
      return grp;
    }

    // People scattered around the block: chatting, sitting,
    // standing. Walking pedestrians are added separately below
    // because they need to be animated each frame.
    const peopleSpots = [
      // Sitting on existing benches
      { pose:'sit',   x:-12,  z:20.6,   ry:0,            seed: 1 },
      { pose:'sit',   x:  3,  z:-18.4,  ry:Math.PI,      seed: 2 },

    // ---- Walking pedestrians (animated each frame) ----
    // Each walker gets a closed path of waypoints. The loop in
    // updatePedestrians moves them along the path, faces them in

    const ringX = halfW0 + sidewalkW * 0.55;   // ~12.95
    const ringZ = halfD0 + sidewalkW * 0.55;   // ~ 8.45
    const ringXIn = halfW0 + sidewalkW * 0.25;

    const innerCW = [
      [ ringX, -ringZ], [ ringX,  ringZ],
      [-ringX,  ringZ], [-ringX, -ringZ]
    ];
    // Inner ring loop, counter-clockwise (inner edge of sidewalk)
    const innerCCW = [
      [-ringXIn, -ringZIn], [-ringXIn,  ringZIn],

    // Park N-S spine: down through north park, into south park, back
    const parkSpine = [

    const outerSouthPath = [

    function spawnPedestrian(seed, path, startSeg, speed){
      const grp = makePerson(seed, 'walk');
      const start = path[startSeg];
      const next  = path[(startSeg + 1) % path.length];
      const initYaw = Math.atan2(next[0] - start[0], next[1] - start[1]);
      grp.position.set(start[0], groundY + 0.05, start[1]);
      grp.rotation.y = initYaw;
      grp.userData.skipLine = true;
      scene.add(grp);
      PEDESTRIANS.push({
        group: grp,
        path: path,
        segIdx: startSeg,
        segT: 0,
        speed: speed,
        currentYaw: initYaw,           // smoothed-toward-target yaw
        baseY: groundY + 0.05,         // baseline ground height for bob
        phaseOffset: (seed * 1.7) % (Math.PI * 2),
        legL: grp.userData.legL,
        legR: grp.userData.legR,
        armL: grp.userData.armL,
        armR: grp.userData.armR
      });
    }

    // 3 walkers on the inner ring CW, spaced around the loop
    spawnPedestrian(101, innerCW,  0, 1.4);

    // ---- Amazon Prime delivery vans ----
    // Mercedes-Sprinter-style high-roof cargo van: charcoal body
    // with the Prime smile graphic on the side, black wheel arches,
    // big windshield, two front headlights, and rear taillights.
    // Two vans drive the inner ring road (one CW, one CCW), and a
    // third sits parked on the outer perimeter strip.
    function makeAmazonVan(){
      const grp = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x4a4a4d, roughness: 0.55, metalness: 0.45
      });
      const trimMat = new THREE.MeshStandardMaterial({
        color: 0x1c1c1e, roughness: 0.7
      });
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0x12181c, roughness: 0.2, metalness: 0.6,
        transparent: true, opacity: 0.85
      });
      const tireMat = new THREE.MeshStandardMaterial({
        color: 0x14140f, roughness: 0.95
      });
      const rimMat = new THREE.MeshStandardMaterial({
        color: 0x9a9a9c, roughness: 0.45, metalness: 0.7
      });
      const headlampMat = new THREE.MeshStandardMaterial({
        color: 0xfff2c8, roughness: 0.25, metalness: 0.3,
        emissive: 0xffe8a0, emissiveIntensity: 0.3
      });
      const taillampMat = new THREE.MeshStandardMaterial({
        color: 0xc94838, roughness: 0.4,
        emissive: 0x802018, emissiveIntensity: 0.25
      });
      const grilleMat = new THREE.MeshStandardMaterial({
        color: 0x0c0c0e, roughness: 0.8
      });

      // Forward direction is +Z (matches pedestrian yaw convention).
      // Body dims: ~5.9m long, 2.0m wide, 2.7m tall.
      const VL = 5.9, VW = 2.0, CARGO_H = 2.05, CAB_H = 1.55;

      // Cargo body (taller rear box)
      const cargo = new THREE.Mesh(
        new THREE.BoxGeometry(VW, CARGO_H, VL * 0.62), bodyMat
      );
      cargo.position.set(0, 0.55 + CARGO_H / 2, -VL * 0.07);
      cargo.castShadow = true;
      grp.add(cargo);

      // Cab section (lower roof up front)
      const cab = new THREE.Mesh(
        new THREE.BoxGeometry(VW, CAB_H, VL * 0.32), bodyMat
      );
      cab.position.set(0, 0.55 + CAB_H / 2, VL * 0.30);
      cab.castShadow = true;
      grp.add(cab);

      // Sloped hood: wedge between cab and front bumper
      const hoodG = new THREE.BoxGeometry(VW * 0.97, 0.55, VL * 0.10);
      const hood = new THREE.Mesh(hoodG, bodyMat);
      hood.position.set(0, 0.55 + 0.55 / 2, VL * 0.49);
      grp.add(hood);

      // Windshield (sloped, tinted)
      const wsG = new THREE.BoxGeometry(VW * 0.92, 1.0, 0.06);
      const ws = new THREE.Mesh(wsG, glassMat);
      ws.position.set(0, 0.55 + CAB_H * 0.62, VL * 0.46);
      ws.rotation.x = -0.32;
      grp.add(ws);

      // Side windows on the cab (driver + passenger)
      for (let s = -1; s <= 1; s += 2){
        const sw = new THREE.Mesh(
          new THREE.BoxGeometry(0.06, 0.55, VL * 0.18), glassMat
        );
        sw.position.set(s * (VW / 2 + 0.005), 0.55 + CAB_H * 0.65, VL * 0.32);
        grp.add(sw);
      }

      // Rear doors split + windows
      for (let s = -1; s <= 1; s += 2){
        const rwG = new THREE.BoxGeometry(VW * 0.4, 0.5, 0.05);
        const rw = new THREE.Mesh(rwG, glassMat);
        rw.position.set(s * (VW * 0.22), 0.55 + CARGO_H * 0.78, -VL * 0.38);
        grp.add(rw);
      }
      // Vertical seam down the rear
      const seam = new THREE.Mesh(
        new THREE.BoxGeometry(0.04, CARGO_H * 0.95, 0.02), trimMat
      );
      seam.position.set(0, 0.55 + CARGO_H / 2, -VL * 0.38);
      grp.add(seam);

      // Front bumper + grille
      const bumper = new THREE.Mesh(
        new THREE.BoxGeometry(VW * 0.99, 0.32, 0.18), trimMat
      );
      bumper.position.set(0, 0.45, VL * 0.535);
      grp.add(bumper);
      const grille = new THREE.Mesh(
        new THREE.BoxGeometry(VW * 0.6, 0.35, 0.08), grilleMat
      );
      grille.position.set(0, 0.78, VL * 0.535);
      grp.add(grille);

      // Headlights — two pairs flanking the grille
      for (let s = -1; s <= 1; s += 2){
        const hl = new THREE.Mesh(
          new THREE.BoxGeometry(0.32, 0.18, 0.06), headlampMat
        );
        hl.position.set(s * (VW * 0.36), 0.78, VL * 0.572);
        grp.add(hl);
      }

      // Taillights
      for (let s = -1; s <= 1; s += 2){
        const tl = new THREE.Mesh(
          new THREE.BoxGeometry(0.18, 0.32, 0.06), taillampMat
        );
        tl.position.set(s * (VW * 0.42), 0.55 + CARGO_H * 0.55, -VL * 0.503);
        grp.add(tl);
      }

      // Rear bumper
      const rearBumper = new THREE.Mesh(
        new THREE.BoxGeometry(VW * 0.99, 0.28, 0.18), trimMat
      );
      rearBumper.position.set(0, 0.42, -VL * 0.502);
      grp.add(rearBumper);

      // Wheel arches and wheels (front + rear, both sides)
      function addWheel(zPos){
        for (let s = -1; s <= 1; s += 2){
          // Tire
          const tireG = new THREE.CylinderGeometry(0.42, 0.42, 0.34, 16);
          const tire = new THREE.Mesh(tireG, tireMat);
          tire.rotation.z = Math.PI / 2;
          tire.position.set(s * (VW / 2 - 0.05), 0.42, zPos);
          tire.castShadow = true;
          grp.add(tire);
          // Rim (slightly recessed, lighter)
          const rimG = new THREE.CylinderGeometry(0.22, 0.22, 0.36, 12);
          const rim = new THREE.Mesh(rimG, rimMat);
          rim.rotation.z = Math.PI / 2;
          rim.position.set(s * (VW / 2 - 0.04), 0.42, zPos);
          grp.add(rim);
          // Wheel arch (small dark fender flare)
          const arch = new THREE.Mesh(
            new THREE.BoxGeometry(0.12, 0.5, 1.05), trimMat
          );
          arch.position.set(s * (VW / 2 + 0.02), 0.6, zPos);
          grp.add(arch);
        }
      }
      addWheel(VL * 0.32);    // front axle
      addWheel(-VL * 0.28);   // rear axle

      // Rocker panel trim
      for (let s = -1; s <= 1; s += 2){
        const rocker = new THREE.Mesh(
          new THREE.BoxGeometry(0.06, 0.12, VL * 0.92), trimMat
        );
        rocker.position.set(s * (VW / 2 + 0.005), 0.4, -VL * 0.04);
        grp.add(rocker);
      }

      // Side mirrors
      for (let s = -1; s <= 1; s += 2){
        const mr = new THREE.Mesh(
          new THREE.BoxGeometry(0.18, 0.32, 0.12), bodyMat
        );
        mr.position.set(s * (VW / 2 + 0.18), 0.55 + CAB_H * 0.55, VL * 0.40);
        grp.add(mr);
      }

      // Roof antenna (small fin)
      const ant = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.16, 0.18), trimMat
      );
      ant.position.set(0, 0.55 + CARGO_H + 0.08, VL * 0.05);
      grp.add(ant);

      // Prime smile graphic on the cargo side panels — drawn into a
      // canvas texture and applied as a decal-style plane on each side.
      function makePrimeSideTex(){
        const c = document.createElement('canvas');
        c.width = 512; c.height = 256;
        const g = c.getContext('2d');
        // Background matches body tone (texture stays invisible
        // outside the painted area thanks to alpha)
        g.clearRect(0, 0, 512, 256);
        // "prime" wordmark
        g.fillStyle = '#e8e8ea';
        g.font = 'bold 64px sans-serif';
        g.fillText('prime', 220, 110);
        // Smile arrow (cyan curve from "p" to under "e", with arrowhead)
        g.strokeStyle = '#00a8e0';
        g.lineWidth = 18;
        g.lineCap = 'round';
        g.beginPath();
        g.moveTo(190, 130);
        g.bezierCurveTo(260, 220, 380, 220, 460, 140);
        g.stroke();
        // Arrowhead
        g.fillStyle = '#00a8e0';
        g.beginPath();
        g.moveTo(465, 142);
        g.lineTo(440, 175);
        g.lineTo(478, 168);
        g.closePath();
        g.fill();
        // Subline
        g.fillStyle = '#dcdce0';
        g.font = '20px sans-serif';
        g.fillText('100% Electric', 230, 175);
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        tex.anisotropy = 4;
        return tex;
      }
      const primeTex = makePrimeSideTex();
      const decalMat = new THREE.MeshBasicMaterial({
        map: primeTex, transparent: true
      });
      // Left side decal (faces -X)
      const decalL = new THREE.Mesh(
        new THREE.PlaneGeometry(VL * 0.5, CARGO_H * 0.55), decalMat
      );
      decalL.position.set(-VW / 2 - 0.005, 0.55 + CARGO_H * 0.58, -VL * 0.05);
      decalL.rotation.y = -Math.PI / 2;
      grp.add(decalL);
      // Right side decal (faces +X) — flipped horizontally so the
      // smile reads correctly on the opposite side
      const decalR = decalL.clone();
      decalR.material = new THREE.MeshBasicMaterial({
        map: primeTex, transparent: true, side: THREE.DoubleSide
      });
      decalR.position.x = VW / 2 + 0.005;
      decalR.rotation.y = Math.PI / 2;
      decalR.scale.x = -1;
      grp.add(decalR);

      grp.userData.skipLine = true;   // real-world object, not architecture
      return grp;
    }

    // Driving paths on the OUTER PERIMETER ring road. The inner ring
    // is partially blocked by the north-face Superblock plaza (which
    // occupies the entire inner north road segment), so vans drive
    // the outer perimeter instead. This keeps them strictly on
    // tarmac and well clear of the plaza, parked van, and all props.
    //
    // Outer perimeter centerlines:
    //   N: z = outerN - perimW/2 = -36.5
    //   S: z = outerS + perimW/2 =  35.5
    //   W: x = outerW - perimW/2 = -41.5
    //   E: x = outerE + perimW/2 =  36.5
    // perimW = 5m. Two lanes at ±perimW * 0.25 = ±1.25m from centerline.
    const innerLaneOff  = perimW * 0.25;   // 1.25m toward block
    const outerLaneOff  = perimW * 0.25;   // 1.25m away from block
    const NCenter = outerN - perimW / 2;
    const SCenter = outerS + perimW / 2;
    const ECenter = outerE + perimW / 2;
    const WCenter = outerW - perimW / 2;

    // Helper: build a closed path that visits 4 rectangular corners
    // with a rounded bezier arc at each one, so the van body sweeps
    // smoothly through turns instead of overshooting onto adjacent
    // surfaces. Uses a quadratic bezier from (corner - r * inDir) to
    // (corner + r * outDir) with the corner itself as control point.
    function buildRoundedRectPath(corners, radius, segPerCorner){
      const path = [];
      const N = corners.length;
      for (let i = 0; i < N; i++){
        const prev = corners[(i - 1 + N) % N];
        const cur  = corners[i];
        const next = corners[(i + 1) % N];

        const inDx = cur[0] - prev[0], inDz = cur[1] - prev[1];
        const inLen = Math.hypot(inDx, inDz) || 1;
        const inNx = inDx / inLen, inNz = inDz / inLen;

        const outDx = next[0] - cur[0], outDz = next[1] - cur[1];
        const outLen = Math.hypot(outDx, outDz) || 1;
        const outNx = outDx / outLen, outNz = outDz / outLen;

        const r = Math.min(radius, inLen / 2.5, outLen / 2.5);
        const startX = cur[0] - inNx * r;
        const startZ = cur[1] - inNz * r;
        const endX   = cur[0] + outNx * r;
        const endZ   = cur[1] + outNz * r;

        path.push([startX, startZ]);
        for (let s = 1; s <= segPerCorner; s++){
          const t = s / (segPerCorner + 1);
          const u = 1 - t;
          const px = u * u * startX + 2 * u * t * cur[0] + t * t * endX;
          const pz = u * u * startZ + 2 * u * t * cur[1] + t * t * endZ;
          path.push([px, pz]);
        }
        path.push([endX, endZ]);
      }
      return path;
    }

    // CW van: inner lane (closer to the block / building cluster).
    // Order: NE -> SE -> SW -> NW around the outer perimeter.
    const cwCorners = [
      [ ECenter - innerLaneOff, NCenter + innerLaneOff ],   // NE
      [ ECenter - innerLaneOff, SCenter - innerLaneOff ],   // SE
      [ WCenter + innerLaneOff, SCenter - innerLaneOff ],   // SW
      [ WCenter + innerLaneOff, NCenter + innerLaneOff ]    // NW
    ];
    const vanCW  = buildRoundedRectPath(cwCorners,  2.0, 6);

    // CCW van: outer lane (away from the block).
    // Order: NW -> SW -> SE -> NE around the outer perimeter.
    const ccwCorners = [
      [ WCenter - outerLaneOff, NCenter - outerLaneOff ],   // NW
      [ WCenter - outerLaneOff, SCenter + outerLaneOff ],   // SW
      [ ECenter + outerLaneOff, SCenter + outerLaneOff ],   // SE
      [ ECenter + outerLaneOff, NCenter - outerLaneOff ]    // NE
    ];
    const vanCCW = buildRoundedRectPath(ccwCorners, 2.0, 6);

    function spawnVan(path, startSeg, speed){
      const grp = makeAmazonVan();
      const a = path[startSeg];
      const b = path[(startSeg + 1) % path.length];
      const yaw = Math.atan2(b[0] - a[0], b[1] - a[1]);
      grp.position.set(a[0], groundY + 0.05, a[1]);
      grp.rotation.y = yaw;
      scene.add(grp);
      VEHICLES.push({
        group: grp, path: path, segIdx: startSeg, segT: 0,
        speed: speed, currentYaw: yaw
      });
    }
    spawnVan(vanCW,  0, 5.5);
    spawnVan(vanCCW, 0, 4.8);

    // Parked van — parallel-parked along the curb of the inner south
    // road, well clear of both driving lanes (which are out on the
    // outer perimeter) and the parkSpine pedestrian path at x = ±0.6.
    // Sits at x=-13 (west of the central building), oriented east-west.
    (function parkedVan(){
      const grp = makeAmazonVan();
      const parkZ = halfD0 + sidewalkW + 1.4;   // 1.4m off the inner curb
      grp.position.set(-13, groundY + 0.05, parkZ);
      grp.rotation.y = Math.PI / 2;             // nose toward +X (east)
      scene.add(grp);
    })();

    // ---- Café table set: bistro table + 2-3 chairs + parasol ----
    function makeCafeSet(seed, withUmbrella){
      const grp = new THREE.Group();
      const rnd = n => {
        const x = Math.sin(seed * 4.91 + n * 17.3) * 43758.5453;
        return x - Math.floor(x);
      };
      const tableMat = new THREE.MeshStandardMaterial({ color:0xeae3d2, roughness:0.85 });
      const stemMat  = new THREE.MeshStandardMaterial({ color:0x4a4a48, roughness:0.55, metalness:0.55 });
      const seatMat  = new THREE.MeshStandardMaterial({ color:0x7a4a2a, roughness:0.8 });

      // Table top + stem
      const top = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.04, 16), tableMat);
      top.position.y = 0.74; grp.add(top);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.72, 8), stemMat);
      stem.position.y = 0.36; grp.add(stem);
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.04, 12), stemMat);
      base.position.y = 0.02; grp.add(base);

      // Chairs around the table
      const chairCount = 2 + (seed % 2);
      for (let i = 0; i < chairCount; i++){
        const a = (i / chairCount) * Math.PI * 2 + rnd(i + 1) * 0.4;
        const cx = Math.cos(a) * 0.85;
        const cz = Math.sin(a) * 0.85;
        const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.04, 10), seatMat);
        seat.position.set(cx, 0.45, cz); grp.add(seat);
        const cstem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.45, 6), stemMat);
        cstem.position.set(cx, 0.225, cz); grp.add(cstem);
        // Backrest
        const back = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.32, 0.03), seatMat);
        back.position.set(cx + Math.cos(a) * 0.12, 0.62, cz + Math.sin(a) * 0.12);
        back.rotation.y = -a + Math.PI / 2;
        grp.add(back);
      }

      // Parasol (umbrella) - optional
      if (withUmbrella){
        const colors = [0xc4282a, 0x2a6a48, 0x2a4a82, 0xd9a028, 0x8a3a5a];
        const umbrellaMat = new THREE.MeshStandardMaterial({
          color: colors[seed % colors.length], roughness:0.7, side: THREE.DoubleSide
        });
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.5, 6), stemMat);
        pole.position.y = 1.5; grp.add(pole);
        const canopy = new THREE.Mesh(
          new THREE.ConeGeometry(0.95, 0.45, 12, 1, true), umbrellaMat
        );
        canopy.position.y = 2.15; grp.add(canopy);
      }

      return grp;
    }

    const cafeSpots = [
      // Outside B2 (amber awning, north row east)
      { x: 11,   z:-13.5, ry: 0.3, umb:true,  seed:30 },
      { x: 14.8, z:-13.5, ry:-0.2, umb:false, seed:31 },
      // Outside B5 (forest green awning, south row west)
      { x:-13.5, z: 18.4, ry: 0.1, umb:true,  seed:32 },
      { x:-17,   z: 18.4, ry:-0.3, umb:false, seed:33 },
      // Outside B6 (navy awning, west)
      { x:-21,   z:  3,   ry: 0.4, umb:true,  seed:34 },
      // Spilling into east park near the bench
      { x: 25,   z: -1,   ry: 0,   umb:true,  seed:35 }
    ];
    cafeSpots.forEach(function(s){
      const set = makeCafeSet(s.seed, s.umb);
      set.position.set(s.x, groundY + 0.05, s.z);
      set.rotation.y = s.ry;
      scene.add(set);
    });

    // ---- Raised planter (concrete trough with flowers) ----
    function makePlanter(seed, w, d){
      const grp = new THREE.Group();
      const rnd = n => {
        const x = Math.sin(seed * 3.21 + n * 11.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const stoneMat = new THREE.MeshStandardMaterial({ color:0xb8b1a0, roughness:0.93 });
      const dirtMat  = new THREE.MeshStandardMaterial({ color:0x3a2a1c, roughness:0.95 });
      const trough = new THREE.Mesh(new THREE.BoxGeometry(w, 0.55, d), stoneMat);
      trough.position.y = 0.275; grp.add(trough);
      const dirt = new THREE.Mesh(new THREE.BoxGeometry(w - 0.18, 0.06, d - 0.18), dirtMat);
      dirt.position.y = 0.56; grp.add(dirt);
      // Flowers / foliage on top
      const greens = [0x4a6a30, 0x55732e, 0x3e5a28, 0x6a8042];
      const blooms = [0xe07050, 0xe0a838, 0xd8d0e8, 0xe25a8a, 0xfff2a0];
      const count = Math.max(3, Math.round((w * d) * 1.2));
      for (let i = 0; i < count; i++){
        const fx = (rnd(i * 2 + 1) - 0.5) * (w - 0.3);
        const fz = (rnd(i * 2 + 2) - 0.5) * (d - 0.3);
        const isFlower = rnd(i * 2 + 3) < 0.45;
        const col = isFlower
          ? blooms[Math.floor(rnd(i * 2 + 4) * blooms.length)]
          : greens[Math.floor(rnd(i * 2 + 5) * greens.length)];
        const mat = new THREE.MeshStandardMaterial({ color: col, roughness:0.85 });
        const r = 0.10 + rnd(i * 2 + 6) * 0.08;
        const blob = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 6), mat);
        blob.position.set(fx, 0.6 + r * 0.7, fz);
        grp.add(blob);
      }
      return grp;
    }

    const planterSpots = [
      // Inner ring sidewalk corners (where the placeholder building's
      // four sidewalks meet) -- visual softening of the curb
      { x: halfW0 + sidewalkW * 0.55,  z:  halfD0 + sidewalkW * 0.55, w:1.2, d:1.2, seed:40 },
      { x:-halfW0 - sidewalkW * 0.55,  z:  halfD0 + sidewalkW * 0.55, w:1.2, d:1.2, seed:41 },
      { x: halfW0 + sidewalkW * 0.55,  z: -halfD0 - sidewalkW * 0.55, w:1.2, d:1.2, seed:42 },
      { x:-halfW0 - sidewalkW * 0.55,  z: -halfD0 - sidewalkW * 0.55, w:1.2, d:1.2, seed:43 },
      // Long planters along storefront awnings
      { x:  9,    z:-13.6, w:1.8, d:0.6, seed:44 },   // B2 amber storefront
      { x:-19,    z: 18.4, w:0.6, d:1.4, seed:45 },   // B5 storefront
      { x:-21,    z: -2.5, w:0.6, d:1.4, seed:46 },   // B6 storefront
      // Punctuation along the new park N-S spine
      { x: 1.8,   z: -28,  w:0.7, d:1.0, seed:47 },
      { x:-1.8,   z: -19,  w:0.7, d:1.0, seed:48 },
      { x: 1.8,   z:  20,  w:0.7, d:1.0, seed:49 },
      { x:-1.8,   z:  29,  w:0.7, d:1.0, seed:50 }
    ];
    planterSpots.forEach(function(s){
      const p = makePlanter(s.seed, s.w, s.d);
      p.position.set(s.x, groundY + 0.05, s.z);
      scene.add(p);
    });

    // ---- North-face plaza (Barcelona Superblock / Superilla style) ----
    // Tactical-urbanism plaza on dark asphalt with painted yellow
    // triangle markings, modular blonde-wood planter boxes filled
    // with grasses, slat-benches integrated into some of the planters,
    // and bollards separating it from the through-roads on either side.
    // Replaces the entire north inner road segment in front of the
    // central building. The raised dark slab hides the road, dashed
    // lane line, and crosswalk that sit at lower y values underneath.
    (function addNorthFacePlaza(){
      const PLAZA_W = 22;
      const PLAZA_D = 5.2;
      const PLAZA_CZ = -halfD0 - sidewalkW - PLAZA_D / 2;

      // Dark asphalt slab — same dark tone as the road around it,
      // raised slightly so road markings underneath disappear.
      const asphaltMat = new THREE.MeshStandardMaterial({
        color: 0x3a3530, roughness: 0.96
      });
      const slab = new THREE.Mesh(
        new THREE.BoxGeometry(PLAZA_W, 0.1, PLAZA_D), asphaltMat
      );
      slab.position.set(0, groundY + 0.06, PLAZA_CZ);
      slab.receiveShadow = true;
      scene.add(slab);

      // Painted yellow triangles — bold, varied sizes and rotations.
      // Drawn as flat triangle BufferGeometry meshes lying on the slab.
      const yellowMat = new THREE.MeshStandardMaterial({
        color: 0xe6b53a, roughness: 0.7, side: THREE.DoubleSide
      });
      function addPaintTri(cx, cz, size, rotRad, skewA, skewB){
        const a1 = rotRad;
        const a2 = rotRad + Math.PI * 2 / 3 + (skewA || 0);
        const a3 = rotRad + Math.PI * 4 / 3 + (skewB || 0);
        const r1 = size;
        const r2 = size * 0.95;
        const r3 = size * 1.05;
        const verts = new Float32Array([
          Math.cos(a1) * r1, 0, Math.sin(a1) * r1,
          Math.cos(a2) * r2, 0, Math.sin(a2) * r2,
          Math.cos(a3) * r3, 0, Math.sin(a3) * r3
        ]);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
        geo.computeVertexNormals();
        const tri = new THREE.Mesh(geo, yellowMat);
        tri.position.set(cx, groundY + 0.115, cz);
        scene.add(tri);
      }
      // Triangle layout: scattered with intentional asymmetry
      const triPaints = [
        { cx: -9.5, dz: -1.4, size: 0.85, rot:  0.4, sa: 0.2, sb:-0.1 },
        { cx: -7.0, dz:  1.6, size: 1.3,  rot: -1.2, sa: 0.0, sb: 0.3 },
        { cx: -4.5, dz: -1.2, size: 0.95, rot:  2.1, sa:-0.2, sb: 0.1 },
        { cx: -2.0, dz:  1.8, size: 1.1,  rot:  0.7, sa: 0.3, sb: 0.0 },
        { cx:  0.2, dz: -1.8, size: 1.5,  rot: -0.5, sa: 0.0, sb: 0.2 },
        { cx:  2.5, dz:  0.5, size: 0.7,  rot:  1.6, sa: 0.1, sb:-0.3 },
        { cx:  4.8, dz: -1.5, size: 1.0,  rot:  3.0, sa:-0.1, sb: 0.2 },
        { cx:  7.2, dz:  1.3, size: 1.25, rot:  0.2, sa: 0.2, sb: 0.0 },
        { cx:  9.5, dz: -1.0, size: 0.9,  rot: -1.7, sa: 0.0, sb: 0.3 },
        { cx: -8.5, dz:  0.2, size: 0.6,  rot:  2.5, sa:-0.2, sb:-0.2 },
        { cx:  6.0, dz:  0.0, size: 0.65, rot:  1.0, sa: 0.3, sb: 0.1 },
        { cx: -1.5, dz: -0.4, size: 0.55, rot:  3.4, sa: 0.0, sb: 0.0 }
      ];
      triPaints.forEach(t => addPaintTri(t.cx, PLAZA_CZ + t.dz, t.size, t.rot, t.sa, t.sb));

      // Modular wooden planter box. Blonde wood with a yellow rim,
      // dirt, and tufts of grass+fern on top. Optional bench plank
      // attached to one long side ("face").
      function makeWoodenPlanter(w, d, withBench){
        const grp = new THREE.Group();
        const wood = new THREE.MeshStandardMaterial({
          color: 0xb88a4a, roughness: 0.85
        });
        const woodDark = new THREE.MeshStandardMaterial({
          color: 0x8a6638, roughness: 0.85
        });
        const yellowRim = new THREE.MeshStandardMaterial({
          color: 0xe6b53a, roughness: 0.75
        });
        const dirtMat = new THREE.MeshStandardMaterial({
          color: 0x3a2a1c, roughness: 0.95
        });
        const grassA = new THREE.MeshStandardMaterial({
          color: 0x5a7032, roughness: 0.85
        });
        const grassB = new THREE.MeshStandardMaterial({
          color: 0x6e8540, roughness: 0.85
        });
        const grassC = new THREE.MeshStandardMaterial({
          color: 0x8a9648, roughness: 0.85
        });
        const grassMats = [grassA, grassB, grassC];

        const H = 0.55;
        // Main wood box
        const box = new THREE.Mesh(new THREE.BoxGeometry(w, H, d), wood);
        box.position.y = H / 2;
        grp.add(box);
        // Horizontal slat shadow lines (thin darker strips at heights)
        for (let i = 1; i <= 3; i++){
          const stripY = (H * i) / 4;
          const strip = new THREE.Mesh(
            new THREE.BoxGeometry(w + 0.005, 0.02, d + 0.005), woodDark
          );
          strip.position.y = stripY;
          grp.add(strip);
        }
        // Yellow top rim
        const rim = new THREE.Mesh(
          new THREE.BoxGeometry(w + 0.04, 0.05, d + 0.04), yellowRim
        );
        rim.position.y = H + 0.005;
        grp.add(rim);
        // Dirt
        const dirt = new THREE.Mesh(
          new THREE.BoxGeometry(w - 0.18, 0.05, d - 0.18), dirtMat
        );
        dirt.position.y = H + 0.06;
        grp.add(dirt);
        // Foliage clumps — sphere blobs in mixed greens
        const numClumps = Math.max(4, Math.round(w * d * 1.3));
        for (let i = 0; i < numClumps; i++){
          const cx = (Math.sin(i * 12.9 + w * 7) * 0.5) * (w - 0.4);
          const cz = (Math.sin(i * 78.2 + d * 9) * 0.5) * (d - 0.4);
          const r  = 0.16 + ((Math.sin(i * 39.1) + 1) * 0.5) * 0.12;
          const m  = grassMats[i % 3];
          const blob = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 5), m);
          blob.position.set(cx, H + 0.06 + r * 0.5, cz);
          grp.add(blob);
        }
        // Optional integrated bench plank along the +Z face
        if (withBench){
          const seat = new THREE.Mesh(
            new THREE.BoxGeometry(w + 0.2, 0.05, 0.4), wood
          );
          seat.position.set(0, H * 0.7, d / 2 + 0.22);
          grp.add(seat);
          for (let s = -1; s <= 1; s += 2){
            const leg = new THREE.Mesh(
              new THREE.BoxGeometry(0.06, H * 0.7, 0.06), woodDark
            );
            leg.position.set(s * (w * 0.42), H * 0.35, d / 2 + 0.22);
            grp.add(leg);
          }
        }
        return grp;
      }

      // Place planters in two parallel rows. The two center planters
      // are intentionally omitted to leave a clear north-south
      // pedestrian corridor through the plaza for the park-to-building
      // pathway.
      function placePlanter(cx, cz, w, d, withBench, ry){
        const p = makeWoodenPlanter(w, d, withBench);
        p.position.set(cx, groundY + 0.11, cz);
        if (ry !== undefined) p.rotation.y = ry;
        scene.add(p);
      }
      // North row (along the road-facing edge) — benches face south
      placePlanter(-7.5, PLAZA_CZ - 1.7, 4.0, 1.0, true,  0);
      placePlanter( 5.5, PLAZA_CZ - 1.7, 3.5, 1.0, true,  0);
      // South row (along the sidewalk-facing edge) — benches face north
      placePlanter(-6.5, PLAZA_CZ + 1.7, 3.5, 1.0, true,  Math.PI);
      placePlanter( 7.5, PLAZA_CZ + 1.7, 4.0, 1.0, true,  Math.PI);

      const plazaPeople = [
        { pose:'sit',   x:-7.5, z: PLAZA_CZ - 1.0,  ry: 0,            seed: 800 },
        { pose:'sit',   x: 5.5, z: PLAZA_CZ - 1.0,  ry: 0,            seed: 801 },
        { pose:'sit',   x:-6.5, z: PLAZA_CZ + 2.4,  ry: Math.PI,      seed: 802 },
        { pose:'sit',   x: 7.5, z: PLAZA_CZ + 2.4,  ry: Math.PI,      seed: 803 },

    // ---- Pathway from the park, through the plaza, to the building ----
    // Single continuous 2.8m wide light-pavered walkway, raised slightly

    // asphalt and the plaza's painted yellow triangles. The corridor

    // the north park, across the plaza, over the inner sidewalk, to
    // the building's north wall. Yellow paint arrows along the path
    // point south toward the building so the route reads at a glance.
    (function addParkToBuildingPath(){
      const PATH_W   = 2.8;
      const PATH_N   = -20.0;                    // 4.75m into the north park grass
      const PATH_S   = -D_HOUSE / 2 + 0.15;      // slight overlap into building wall

        color: 0xc8c2b3, roughness: 0.93
      });
      const slab = new THREE.Mesh(
        new THREE.BoxGeometry(PATH_W, 0.1, PATH_LEN), paverMat
      );
      slab.position.set(0, PATH_Y, PATH_CZ);
      slab.receiveShadow = true;
      scene.add(slab);

      // Slim darker contrast strips for paving rhythm — one every ~2m
      const stripMat = new THREE.MeshStandardMaterial({
        color: 0xa8a294, roughness: 0.93
      });
      const stripCount = Math.floor(PATH_LEN / 2.0);
      for (let i = 1; i < stripCount; i++){
        const t = i / stripCount;
        const sz = PATH_N + t * PATH_LEN;
        const strip = new THREE.Mesh(
          new THREE.BoxGeometry(PATH_W - 0.4, 0.02, 0.16), stripMat
        );
        strip.position.set(0, PATH_Y + 0.06, sz);
        scene.add(strip);

    })();

    // ============================================================
    // Horizon district: three rings of buildings beyond the
    // perimeter road. The player can never reach them because
    // BLOCK_BOUNDS already clamps street-level walking to the

    //   Ring 1 (~45 out): across-the-street neighbors, full detail
    //   Ring 2 (~65 out): mid-distance, taller average heights
    //   Ring 3 (~95 to 110 out): far skyline towers, low detail
    // ============================================================

    // ---- Ring 1: across-the-street row ----

    // when you walk up to the curb and look across the road.
    const horizonRing1 = [
      // North side (across the north perimeter road, -Z)
      { x:-32, z:-46, w:14, d:11, h:36, style:'redBrick',   floors:11, bays:5, features:['water_tower','ac_units'] },

      { x:  4, z: 48, w:15, d:13, h:52, style:'glass',      floors:17, bays:6, features:['hvac','antenna'] },
      { x: 21, z: 47, w:14, d:12, h:30, style:'tanBrick',   floors:10, bays:5, features:['fire_escape_north'] },

    horizonRing1.forEach(function(b){

    // ---- Ring 2: mid-distance ----

    const horizonRing2 = [

    horizonRing2.forEach(function(b){

      const lm = makeLineBuilding(b);
      lm.position.set(b.x, groundY, b.z);

      NEIGHBOR_LINE.push(lm);

    // ---- Ring 3: far skyline ----
    // Low-detail tall towers spaced around the outer horizon. Too
    // distant to read fine detail, so we share textures across
    // same-style/same-height-bucket towers and skip rooftop fluff.
    const skylineTexCache = {};
    function getSkylineTex(style, h){
      const bucket = Math.round(h / 18) * 18;
      const key = style + ':' + bucket;
      if (!skylineTexCache[key]){
        const floors = Math.max(8, Math.round(bucket / 3.5));
        skylineTexCache[key] = makeFacade({
          style, floors, bays:4, width:256, height:512, lit:0.22
        });
      }
      return skylineTexCache[key];
    }
    function makeSkylineTower(w, d, h, style){
      const grp = new THREE.Group();
      const tex = getSkylineTex(style, h);
      let mat;
      if (style === 'glass'){
        mat = new THREE.MeshStandardMaterial({
          map:tex, color:0x6878a0, roughness:0.22, metalness:0.7
        });
      } else {
        mat = new THREE.MeshStandardMaterial({ map:tex, roughness:0.9 });
      }
      const roofMat = new THREE.MeshStandardMaterial({ color:0x2a2620, roughness:0.95 });
      const mass = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        [mat, mat, roofMat, roofMat, mat, mat]
      );
      mass.position.y = h / 2;
      grp.add(mass);
      // Quick parapet so the silhouette has a step at the top
      const parapet = new THREE.MeshStandardMaterial({ color:0x3a342c, roughness:0.9 });
      const pH = 0.6;
      const top = new THREE.Mesh(
        new THREE.BoxGeometry(w + 0.2, pH, d + 0.2), parapet
      );
      top.position.y = h + pH / 2;
      grp.add(top);
      return grp;
    }

    const skylineTowers = [
      // North horizon
      { x:-90, z: -95, w:14, d:14, h:72, style:'glass' },
      { x:-65, z:-100, w:13, d:13, h:60, style:'redBrick' },
      { x:-40, z:-105, w:16, d:16, h:88, style:'glass' },
      { x:-12, z:-108, w:18, d:18, h:104, style:'glass' },
      { x: 18, z:-104, w:15, d:15, h:80, style:'tanBrick' },
      { x: 45, z:-100, w:14, d:14, h:64, style:'darkBrick' },
      { x: 72, z: -94, w:16, d:16, h:78, style:'glass' },
      { x: 95, z: -78, w:13, d:13, h:56, style:'redBrick' },
      // South horizon
      { x:-95, z: 92, w:14, d:14, h:62, style:'redBrick' },
      { x:-68, z: 98, w:16, d:16, h:80, style:'glass' },
      { x:-38, z:103, w:18, d:18, h:100, style:'glass' },
      { x: -8, z:106, w:20, d:20, h:118, style:'glass' },
      { x: 22, z:103, w:15, d:15, h:72, style:'tanBrick' },
      { x: 50, z: 98, w:14, d:14, h:60, style:'darkBrick' },
      { x: 78, z: 92, w:16, d:16, h:76, style:'glass' },
      { x:100, z: 76, w:13, d:13, h:54, style:'redBrick' },
      // East horizon
      { x:100, z: -55, w:14, d:14, h:66, style:'glass' },
      { x:104, z: -28, w:15, d:15, h:84, style:'tanBrick' },
      { x:108, z:   0, w:18, d:18, h:108, style:'glass' },
      { x:106, z:  30, w:15, d:15, h:78, style:'redBrick' },
      { x:101, z:  55, w:13, d:13, h:58, style:'darkBrick' },
      // West horizon
      { x:-100, z: -55, w:13, d:13, h:58, style:'darkBrick' },
      { x:-105, z: -28, w:15, d:15, h:80, style:'glass' },
      { x:-110, z:   0, w:17, d:17, h:96, style:'glass' },
      { x:-106, z:  28, w:15, d:15, h:74, style:'tanBrick' },
      { x:-101, z:  55, w:13, d:13, h:62, style:'redBrick' }
    ];
    skylineTowers.forEach(function(t){
      const m = makeSkylineTower(t.w, t.d, t.h, t.style);
      m.position.set(t.x, groundY, t.z);
      scene.add(m);
      NEIGHBOR_REAL.push(m);

      const lm = makeLineSkylineTower(t.w, t.d, t.h);
      lm.position.set(t.x, groundY, t.z);
      lm.visible = false;
      scene.add(lm);
      NEIGHBOR_LINE.push(lm);
    });

    // ============================================================
    // Final pass: walk every other scene child and build a line-art
    // twin for it. Skip lights, the ground plane, anything tagged
    // skipLine (people, walking pedestrians), and the building
    // groups that already have hand-built line versions.
    // Flat ground markings (roads, sidewalks, grass, dashed lines,
    // crosswalk stripes, manhole covers) stay unchanged in line
    // view so the "site plan" reads consistently underneath.
    // ============================================================
    const realBuildingSet = new Set(NEIGHBOR_REAL);
    const lineBuildingSet = new Set(NEIGHBOR_LINE);
    const tmpBox = new THREE.Box3();
    const tmpSize = new THREE.Vector3();

    const childrenSnapshot = scene.children.slice();
    childrenSnapshot.forEach(function(child){
      if (child.isLight) return;
      if (child.isCamera) return;
      if (child.userData && child.userData.skipLine) return;
      if (realBuildingSet.has(child)) return;
      if (lineBuildingSet.has(child)) return;

      // Skip flat ground markings (roads, sidewalks, grass, paths,
      // crosswalk stripes, dashed road lines, court, manholes).
      // They tend to be < 0.3 tall. EXCEPT objects explicitly tagged
      // includeInLine (road slabs) — those get a line twin even
      // though they're flat, so streets become cream paving in
      // architectural view.
      const tagged = child.userData && child.userData.includeInLine;
      tmpBox.setFromObject(child);
      tmpBox.getSize(tmpSize);
      if (tmpSize.y < 0.3 && !tagged) return;

      // Build the line-art twin in place
      const twin = lineify(child);
      twin.position.copy(child.position);
      twin.rotation.copy(child.rotation);
      twin.scale.copy(child.scale);
      twin.visible = false;
      scene.add(twin);

      PROP_REAL.push(child);
      PROP_LINE.push(twin);
    });
  })();

  // Initial orbit camera: parked just above the walk-outside spawn
  // point (north edge of the block, looking south toward the
  // placeholder building) so the opening view matches what you'd
  // see if you immediately clicked "Walk outside".
  let camRadius = 41.5;            // distance from origin in XZ; matches |BLOCK_BOUNDS.minZ + 0.5|
  let camAngle  = -Math.PI / 2;    // places the camera on -Z axis (north edge)
  let camHeight = 12;              // elevated overview, well above the surrounding rooftops
  function updateCam(){
    camera.position.x = Math.cos(camAngle) * camRadius;
    camera.position.z = Math.sin(camAngle) * camRadius;
    camera.position.y = camHeight - BUILDING_H / 2 + 4;
    camera.lookAt(0, 0, 0);
  }
  updateCam();

  // ============================================================
  // PLACEHOLDER: Central building.
  // The original 5-floor conveyor delivery system, its lobby,
  // elevator, conveyors, packages, robots, rooftop park and the
  // beautify-pass (parapet, cornice, brick skin) used to live
  // here -- roughly 3,400 lines of geometry. They have all been
  // stripped out and replaced with a single gray box that
  // matches the original footprint (W_HOUSE x BUILDING_H x
  // D_HOUSE), so the surrounding NYC block stays intact and you
  // can drop a different building back into this slot.
  //
  // Coordinate notes for whatever you put here next:
  //   - Ground level is y = -BUILDING_H / 2
  //   - The building is centered on (0, 0, 0) in plan
  //   - Footprint extends +/- W_HOUSE/2 on x, +/- D_HOUSE/2 on z
  //   - South face (entrance side) faces +Z
  // ============================================================
  (function addCentralPlaceholder(){
    const groundY = -BUILDING_H / 2;
    const placeholderMat = new THREE.MeshStandardMaterial({
      color: 0x9a958c, roughness: 0.92, metalness: 0.03
    });
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(W_HOUSE, BUILDING_H, D_HOUSE),
      placeholderMat
    );
    box.position.set(0, groundY + BUILDING_H / 2, 0);
    box.castShadow = true;
    box.receiveShadow = true;
    scene.add(box);

    // Subtle outline so the box reads as a placeholder, not a finished
    // wall. Just draws the 12 edges of the cuboid in a darker tone.
    const edges = new THREE.EdgesGeometry(
      new THREE.BoxGeometry(W_HOUSE, BUILDING_H, D_HOUSE)
    );
    const lines = new THREE.LineSegments(
      edges, new THREE.LineBasicMaterial({ color: 0x4a463e })
    );
    lines.position.copy(box.position);
    scene.add(lines);
  })();

  // Apply shadows to every opaque mesh in the scene so the surrounding
  // buildings, sidewalks, and trees pick up the directional sun light.
  scene.traverse(obj => {
    if (obj.isSprite) return;
    if (!obj.isMesh) return;
    const m = obj.material;
    if (!m) return;
    const mats = Array.isArray(m) ? m : [m];
    const transparentish = mats.some(x => x && x.transparent && x.opacity < 0.85);
    if (!transparentish) obj.castShadow = true;
    obj.receiveShadow = true;
    mats.forEach(x => {
      if (x && x.isMeshStandardMaterial){
        if (transparentish)               x.envMapIntensity = 0.35;
        else if (x.metalness && x.metalness > 0.3) x.envMapIntensity = 1.15;
        else                              x.envMapIntensity = 0.65;
      }
    });
  });

  // ============================================================
  // Orbit / pan / zoom controls
  // ============================================================
  let dragging = false, lastX = 0, lastY = 0;
  const canvas = renderer.domElement;
  canvas.style.cursor = 'grab';
  canvas.addEventListener('mousedown', e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.style.cursor = 'grabbing';
  });
  window.addEventListener('mouseup', () => {
    dragging = false; canvas.style.cursor = 'grab';
  });
  window.addEventListener('mousemove', e => {
    if (!dragging || FP.active) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    camAngle -= dx * 0.01;
    camHeight = Math.max(-5, Math.min(28, camHeight + dy * 0.05));
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    camRadius = Math.max(14, Math.min(70, camRadius + e.deltaY * 0.03));
  }, { passive:false });
  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1){
      dragging = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }
  });
  canvas.addEventListener('touchmove', e => {
    if (!dragging || e.touches.length !== 1 || FP.active) return;
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    camAngle -= dx * 0.01;
    camHeight = Math.max(-5, Math.min(28, camHeight + dy * 0.05));
  }, { passive:true });
  canvas.addEventListener('touchend', () => dragging = false);

  window.addEventListener('resize', () => {
    renderer.setSize(stage.clientWidth, 560);
    camera.aspect = stage.clientWidth / 560;
    camera.updateProjectionMatrix();
  });

  // ============================================================
  // First-person walk mode (outside only, since the central
  // building is a solid placeholder you can't walk through).
  // ============================================================
  const EYE_HEIGHT = 1.65;
  const FP = {
    active: false,
    pos: new THREE.Vector3(0, 0, 0),
    yaw: 0,
    pitch: 0,
    onGround: true,
    verticalVel: 0,
    keys: {}
  };

  const fpOutBtn   = document.getElementById('btn-fp-out');
  const fpHint     = document.getElementById('fp-hint');
  const fpCross    = document.getElementById('fp-crosshair');
  const fpBanner   = document.getElementById('fp-banner');
  const orbitHint  = document.getElementById('orbit-hint');

  // Central placeholder footprint, used for FP collision so the
  // player can't walk through the gray box.
  const CENTRAL_BOX = {
    x: 0, z: 0, w: W_HOUSE, d: D_HOUSE
  };

  function teleportToOutside(){
    // Spawn at the far north edge of the walkable block, looking south
    // toward the placeholder building.
    FP.pos.set(0, EYE_HEIGHT - BUILDING_H / 2, BLOCK_BOUNDS.minZ + 0.5);
    FP.yaw = 0;   // face +Z, toward the placeholder building
    FP.pitch = 0;
    FP.verticalVel = 0;
    FP.onGround = true;
    setStatus('Walking outside on the block');
  }

  function enterFP(){
    FP.active = true;
    fpOutBtn.textContent = 'Exit walk (Esc)';
    fpHint.style.display    = 'block';
    fpCross.style.display   = 'block';
    fpBanner.style.display  = 'block';
    orbitHint.style.display = 'none';
    teleportToOutside();
  }

  function exitFP(){
    FP.active = false;
    fpOutBtn.textContent = 'Walk outside (F)';
    fpHint.style.display    = 'none';
    fpCross.style.display   = 'none';
    fpBanner.style.display  = 'none';
    orbitHint.style.display = '';
    setStatus('Drag to orbit. Press F to walk.');
  }

  fpOutBtn.addEventListener('click', () => {
    if (FP.active) exitFP(); else enterFP();
  });

  // Architectural line view toggle: swap the realistic surrounding
  // buildings + every prop (trees, lamps, benches, hydrants, mailboxes,
  // background buildings, etc.) for cream-and-black line-art twins,
  // and switch the grass slabs from green texture to a stippled lawn.
  // Crossfade is animated: both versions render at fractional opacity
  // during the transition, snapping back to single-version rendering
  // (with the off side hidden) once the fade settles.
  const lineChk = document.getElementById('chk-line');

  // Lazy-built registries of every material that participates in the
  // crossfade. Built once on the first toggle, cached for reuse.
  let REAL_MATS = null;
  let LINE_MATS = null;
  const ORIG_TRANSPARENT = new Map();

  function collectMaterials(group, target){
    group.traverse(function(o){
      if (!o.material) return;
      if (Array.isArray(o.material)) o.material.forEach(m => target.add(m));
      else target.add(o.material);
    });
  }
  function buildMaterialRegistries(){
    REAL_MATS = new Set();
    LINE_MATS = new Set();
    NEIGHBOR_REAL.forEach(g => collectMaterials(g, REAL_MATS));
    PROP_REAL.forEach(g => collectMaterials(g, REAL_MATS));
    NEIGHBOR_LINE.forEach(g => collectMaterials(g, LINE_MATS));
    PROP_LINE.forEach(g => collectMaterials(g, LINE_MATS));
    GRASS_SLABS.forEach(g => {
      REAL_MATS.add(g.realMat);
      LINE_MATS.add(g.lineMat);
    });
    // Road dashes + crosswalk stripes fade with the rest of the
    // realistic side
    MARKING_MATS.forEach(m => REAL_MATS.add(m));
    REAL_MATS.forEach(m => ORIG_TRANSPARENT.set(m, !!m.transparent));
    LINE_MATS.forEach(m => ORIG_TRANSPARENT.set(m, !!m.transparent));
  }

  let currentLineAmount = 0;   // 0 = realistic, 1 = line
  let fadeRAF = null;

  function setRealOpacity(v){
    REAL_MATS.forEach(m => m.opacity = v);
  }
  function setLineOpacity(v){
    LINE_MATS.forEach(m => m.opacity = v);
  }
  function setRealVisible(v){
    NEIGHBOR_REAL.forEach(o => o.visible = v);
    PROP_REAL.forEach(o => o.visible = v);
    GRASS_SLABS.forEach(g => g.realMesh.visible = v);
    ROAD_MARKINGS.forEach(o => o.visible = v);
  }
  function setLineVisible(v){
    NEIGHBOR_LINE.forEach(o => o.visible = v);
    PROP_LINE.forEach(o => o.visible = v);
    GRASS_SLABS.forEach(g => g.lineMesh.visible = v);
  }

  function applyLineView(targetOn){
    if (!REAL_MATS) buildMaterialRegistries();
    if (fadeRAF){ cancelAnimationFrame(fadeRAF); fadeRAF = null; }

    const target = targetOn ? 1 : 0;
    const start  = currentLineAmount;
    if (start === target) return;

    // Both sides need to be visible during the transition
    setRealVisible(true);
    setLineVisible(true);

    // Force materials transparent for the duration of the fade
    REAL_MATS.forEach(m => { m.transparent = true; });
    LINE_MATS.forEach(m => { m.transparent = true; });

    const t0 = performance.now();
    const duration = Math.abs(target - start) * 600;   // ~600ms full traverse

    function tick(){
      const t = duration <= 0 ? 1 : Math.min(1, (performance.now() - t0) / duration);
      const e = t * t * (3 - 2 * t);   // smoothstep
      const a = start + (target - start) * e;
      currentLineAmount = a;
      setRealOpacity(1 - a);
      setLineOpacity(a);

      if (t < 1){
        fadeRAF = requestAnimationFrame(tick);
        return;
      }

      // Settled: hide whichever side is off, restore opacity + transparent flag
      currentLineAmount = target;
      const lineActive = (target === 1);
      setRealVisible(!lineActive);
      setLineVisible(lineActive);
      REAL_MATS.forEach(m => {
        m.opacity = 1;
        m.transparent = ORIG_TRANSPARENT.get(m) || false;
      });
      LINE_MATS.forEach(m => {
        m.opacity = 1;
        m.transparent = ORIG_TRANSPARENT.get(m) || false;
      });
      fadeRAF = null;
    }
    tick();
  }
  lineChk.addEventListener('change', () => applyLineView(lineChk.checked));

  // Drag-to-look while FP is active. Reuses the orbit drag flag,
  // routes the delta into yaw/pitch instead of orbit angle.
  let fpDragPrevX = 0, fpDragPrevY = 0;
  canvas.addEventListener('mousemove', e => {
    if (!FP.active || !dragging) return;
    const dx = e.clientX - fpDragPrevX;
    const dy = e.clientY - fpDragPrevY;
    fpDragPrevX = e.clientX;
    fpDragPrevY = e.clientY;
    FP.yaw   += dx * 0.005;
    FP.pitch += dy * 0.005;
    const lim = Math.PI / 2 - 0.05;
    if (FP.pitch >  lim) FP.pitch =  lim;
    if (FP.pitch < -lim) FP.pitch = -lim;
  });
  canvas.addEventListener('mousedown', e => {
    if (FP.active){
      fpDragPrevX = e.clientX;
      fpDragPrevY = e.clientY;
      fpBanner.style.display = 'none';
    }
  });
  canvas.addEventListener('touchstart', e => {
    if (FP.active && e.touches.length === 1){
      fpDragPrevX = e.touches[0].clientX;
      fpDragPrevY = e.touches[0].clientY;
      fpBanner.style.display = 'none';
    }
  }, { passive:true });
  canvas.addEventListener('touchmove', e => {
    if (!FP.active || !dragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - fpDragPrevX;
    const dy = e.touches[0].clientY - fpDragPrevY;
    fpDragPrevX = e.touches[0].clientX;
    fpDragPrevY = e.touches[0].clientY;
    FP.yaw   += dx * 0.005;
    FP.pitch += dy * 0.005;
    const lim = Math.PI / 2 - 0.05;
    if (FP.pitch >  lim) FP.pitch =  lim;
    if (FP.pitch < -lim) FP.pitch = -lim;
  }, { passive:true });

  window.addEventListener('keydown', e => {
    if ((e.key === 'f' || e.key === 'F') && !e.shiftKey){
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (!FP.active) enterFP(); else exitFP();
      return;
    }
    if (!FP.active) return;
    if (e.key === 'Escape'){ exitFP(); return; }
    FP.keys[e.code] = true;
    if (e.code === 'Space'){
      if (FP.onGround){
        FP.verticalVel = 4.8;
        FP.onGround = false;
      }
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', e => {
    FP.keys[e.code] = false;
  });

  let lastFPTime = performance.now();
  function updateFP(){
    const now = performance.now();
    let dt = (now - lastFPTime) / 1000;
    lastFPTime = now;
    if (dt > 0.05) dt = 0.05;
    if (!FP.active) return;

    const speed = FP.keys['ShiftLeft'] || FP.keys['ShiftRight'] ? 7.5 : 3.6;
    let mx = 0, mz = 0;
    if (FP.keys['KeyW']) mz += 1;
    if (FP.keys['KeyS']) mz -= 1;
    if (FP.keys['KeyA']) mx += 1;
    if (FP.keys['KeyD']) mx -= 1;
    const len = Math.hypot(mx, mz);
    if (len > 0){ mx /= len; mz /= len; }

    const sinY = Math.sin(FP.yaw), cosY = Math.cos(FP.yaw);
    const worldDx =  mx * cosY + mz * sinY;
    const worldDz = -mx * sinY + mz * cosY;
    FP.pos.x += worldDx * speed * dt;
    FP.pos.z += worldDz * speed * dt;

    const floorY = EYE_HEIGHT - BUILDING_H / 2;
    if (!FP.onGround){
      FP.verticalVel -= 14 * dt;
      FP.pos.y += FP.verticalVel * dt;
      if (FP.pos.y <= floorY){
        FP.pos.y = floorY;
        FP.verticalVel = 0;
        FP.onGround = true;
      }
    } else {
      FP.pos.y = floorY;
    }

    // Stay on the walkable block
    const pad = 0.2;
    if (FP.pos.x < BLOCK_BOUNDS.minX + pad) FP.pos.x = BLOCK_BOUNDS.minX + pad;
    if (FP.pos.x > BLOCK_BOUNDS.maxX - pad) FP.pos.x = BLOCK_BOUNDS.maxX - pad;
    if (FP.pos.z < BLOCK_BOUNDS.minZ + pad) FP.pos.z = BLOCK_BOUNDS.minZ + pad;
    if (FP.pos.z > BLOCK_BOUNDS.maxZ - pad) FP.pos.z = BLOCK_BOUNDS.maxZ - pad;

    // Push out of any surrounding building footprint + the central placeholder
    const obstacles = CITY_OBSTACLES.concat([CENTRAL_BOX]);
    const hitPad = 0.45;
    for (let i = 0; i < obstacles.length; i++){
      const o = obstacles[i];
      const minX = o.x - o.w / 2 - hitPad;
      const maxX = o.x + o.w / 2 + hitPad;
      const minZ = o.z - o.d / 2 - hitPad;
      const maxZ = o.z + o.d / 2 + hitPad;
      if (FP.pos.x > minX && FP.pos.x < maxX && FP.pos.z > minZ && FP.pos.z < maxZ){
        const dxL = FP.pos.x - minX;
        const dxR = maxX - FP.pos.x;
        const dzN = FP.pos.z - minZ;
        const dzS = maxZ - FP.pos.z;
        const m = Math.min(dxL, dxR, dzN, dzS);
        if (m === dxL)      FP.pos.x = minX;
        else if (m === dxR) FP.pos.x = maxX;
        else if (m === dzN) FP.pos.z = minZ;
        else                FP.pos.z = maxZ;
      }
    }

    camera.position.copy(FP.pos);
    const lookDist = 10;
    const lx = FP.pos.x + Math.sin(FP.yaw) * Math.cos(FP.pitch) * lookDist;
    const lz = FP.pos.z + Math.cos(FP.yaw) * Math.cos(FP.pitch) * lookDist;
    const ly = FP.pos.y + Math.sin(FP.pitch) * lookDist;
    camera.lookAt(lx, ly, lz);
  }

  // ============================================================
  // Pedestrian animation: move each walker along its closed
  // path, smoothly turn toward the next segment instead of
  // snapping, swing legs/arms in a sine-wave gait, and bounce
  // slightly with each step. Runs every frame regardless of
  // orbit vs FP mode.
  // ============================================================
  let _pedLastT = performance.now();
  function updateVehicles(dt){
    for (let i = 0; i < VEHICLES.length; i++){
      const v = VEHICLES[i];
      const a = v.path[v.segIdx];
      const b = v.path[(v.segIdx + 1) % v.path.length];
      const segLen = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      v.segT += (v.speed * dt) / segLen;
      while (v.segT >= 1){
        v.segT -= 1;
        v.segIdx = (v.segIdx + 1) % v.path.length;
      }
      const a2 = v.path[v.segIdx];
      const b2 = v.path[(v.segIdx + 1) % v.path.length];
      v.group.position.x = a2[0] + (b2[0] - a2[0]) * v.segT;
      v.group.position.z = a2[1] + (b2[1] - a2[1]) * v.segT;

      const dx = b2[0] - a2[0], dz = b2[1] - a2[1];
      if (dx !== 0 || dz !== 0){
        const targetYaw = Math.atan2(dx, dz);
        let delta = targetYaw - v.currentYaw;
        delta = Math.atan2(Math.sin(delta), Math.cos(delta));
        // Vans turn fast enough to stay aligned with the rounded
        // bezier corners, so the body never overshoots its lane.
        const turnRate = Math.min(1, dt * 8);
        v.currentYaw += delta * turnRate;
        v.group.rotation.y = v.currentYaw;
      }
    }
  }

  function updatePedestrians(){
    const now = performance.now();
    let dt = (now - _pedLastT) / 1000;
    _pedLastT = now;
    if (dt > 0.1) dt = 0.1;
    const tSec = now * 0.001;
    updateVehicles(dt);

    for (let i = 0; i < PEDESTRIANS.length; i++){
      const p = PEDESTRIANS[i];
      const a = p.path[p.segIdx];
      const b = p.path[(p.segIdx + 1) % p.path.length];
      const segLen = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      p.segT += (p.speed * dt) / segLen;
      while (p.segT >= 1){
        p.segT -= 1;
        p.segIdx = (p.segIdx + 1) % p.path.length;
      }
      const a2 = p.path[p.segIdx];
      const b2 = p.path[(p.segIdx + 1) % p.path.length];
      const x = a2[0] + (b2[0] - a2[0]) * p.segT;
      const z = a2[1] + (b2[1] - a2[1]) * p.segT;
      p.group.position.x = x;
      p.group.position.z = z;

      // Smoothly turn toward the current segment direction.
      // Instead of snapping to the new yaw at every corner, lerp
      // through the shortest angular delta over ~150ms.
      const dx = b2[0] - a2[0], dz = b2[1] - a2[1];
      if (dx !== 0 || dz !== 0){
        const targetYaw = Math.atan2(dx, dz);
        let delta = targetYaw - p.currentYaw;
        delta = Math.atan2(Math.sin(delta), Math.cos(delta));   // wrap to [-π, π]
        const turnRate = Math.min(1, dt * 7);
        p.currentYaw += delta * turnRate;
        p.group.rotation.y = p.currentYaw;
      }

      // Gait + bounce. Stride is intentionally narrower than the
      // original 0.45 rad so the rigid (knee-less) legs read as
      // walking instead of windmilling. Two bounces per leg cycle.
      const phase = tSec * 5.4 * (p.speed / 1.4) + p.phaseOffset;
      const swing = Math.sin(phase) * 0.32;
      if (p.legL) p.legL.rotation.x = swing;
      if (p.legR) p.legR.rotation.x = -swing;
      if (p.armL) p.armL.rotation.x = -swing * 0.7;
      if (p.armR) p.armR.rotation.x =  swing * 0.7;
      p.group.position.y = p.baseY + Math.abs(Math.sin(phase)) * 0.028;
    }
  }

  // ============================================================
  // Render loop
  // ============================================================
  function loop(){
    requestAnimationFrame(loop);
    updatePedestrians();
    if (FP.active){
      updateFP();
    } else {
      if (document.getElementById('chk-auto').checked) camAngle += 0.003;
      updateCam();
    }
    renderer.render(scene, camera);
  }
  loop();
})();
</script>

</body>
</html>
